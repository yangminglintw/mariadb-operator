apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-green
spec:
  # Bootstrap the physical backup with the same MariaDB minor as Blue first.
  # Directly preparing a 10.6 physical backup with mariadb-backup 10.11 failed
  # in this scenario.
  image: mariadb:10.6
  rootPasswordSecretKeyRef:
    name: mariadb
    key: password
  storage:
    size: 1Gi
  replicas: 2
  bootstrapFrom:
    s3:
      bucket: multi-cluster
      prefix: blue
      endpoint: minio.minio.svc.cluster.local:9000
      region: us-east-1
      accessKeyIdSecretKeyRef:
        name: minio
        key: access-key-id
      secretAccessKeySecretKeyRef:
        name: minio
        key: secret-access-key
      tls:
        enabled: true
        caSecretKeyRef:
          name: minio-ca
          key: ca.crt
    backupContentType: Physical
  replication:
    enabled: true
    gtidDomainId: 1
    # The Green cluster restores both pods from the Blue backup in this
    # scenario. With strict mode enabled, the second Green pod can hit error
    # 1236 because the restored GTID position is not available in the Green
    # primary binlog.
    gtidStrictMode: false
    serverIdStartIndex: 20
    semiSyncEnabled: false
    replica:
      replPasswordSecretKeyRef:
        name: mariadb
        key: password
  primaryService:
    type: LoadBalancer
    metadata:
      annotations:
        metallb.io/loadBalancerIPs: 172.18.1.25
  multiCluster:
    enabled: true
    primary: mariadb-blue
    members:
      - name: mariadb-blue
        externalMariaDbRef:
          name: mariadb-blue
      - name: mariadb-green
        externalMariaDbRef:
          name: mariadb-green
  # After Blue is in maintenance and Green has zero replication lag, promote Green:
  # kubectl patch mariadb mariadb-green --type merge \
  #   -p '{"spec":{"multiCluster":{"primary":"mariadb-green"}}}'
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: ExternalMariaDB
metadata:
  name: mariadb-green
spec:
  host: mariadb-green-primary.default.svc.cluster.local
  port: 3306
  username: root
  passwordSecretKeyRef:
    name: mariadb
    key: password
